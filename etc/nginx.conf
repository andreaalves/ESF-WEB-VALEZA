server {
    listen   80;
    listen   [::]:80 default ipv6only=on;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens  off;
    server_name _;

    # ---- Headers de segurança ----
    # Impede que o app seja embutido em iframe (clickjacking).
    add_header X-Frame-Options "DENY" always;
    # Impede MIME sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Não vaza a URL completa para terceiros.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Força HTTPS por 1 ano (TLS é terminado no proxy do hosting).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Desliga APIs sensíveis do navegador não usadas pelo app.
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    # Content-Security-Policy: restringe origens de scripts/conexões/imagens.
    # connect-src: API (Railway) + roteamento OSRM. img-src: tiles OpenStreetMap.
    # 'unsafe-inline' em script/style é necessário pelo runtime do CRA e pelo
    # Emotion/Chakra (estilos inline); ainda assim a CSP bloqueia exfiltração
    # para domínios não listados e o carregamento de scripts externos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://esf-api-valeza.up.railway.app https://router.project-osrm.org; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 0;
    gzip_types text/plain application/javascript text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    location / {
        try_files $uri /index.html;
    }
}